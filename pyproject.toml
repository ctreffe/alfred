[project]
name = "alfred3"
dynamic = ["version"]
description = "A library for rapid development of dynamic and interactive online experiments in the social sciences."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Christian Treffenstädt" },
    { name = "Johannes Brachem" },
    { name = "Paul Wiemann" },
]
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["social science", "web experiment"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]


requires-python = ">=3.13"
dependencies = [
    "pymongo>=3.10",
    "cryptography>=3.4",
    "jinja2>=2.11",
    "Flask>=1.1",
    "thesmuggler>=1.0",
    "Click>=7.1",
    "emoji>=1.2,<=1.6.3",
    "cmarkgfm>=0.5",
    "requests>=2.25",
    "bleach>=3.3",
    "pyyaml>=6.0",
    "mongomock",
]

[project.urls]
Homepage = "https://github.com/ctreffe/alfred"
Documentation = "https://alfredo3.psych.bio.uni-goettingen.de/docs/index.html"
Repository = "https://github.com/ctreffe/alfred"


[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "black",
    "flake8",
    "python-dotenv",
    "bs4",
    "selenium",
    "sphinx==4.5.0",
    "sphinx-book-theme==0.3.2",
    "sphinx-remove-toctrees==0.0.3",
    "sphinx-copybutton==0.5.0",
    "recommonmark",
    "setuptools>=80.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
testpaths = "tests"

[tool.ruff]
extend-exclude = ["CHANGELOG.md"]

[tool.ruff.lint]
extend-select = [
    "F",  # pyflakes (flake8 core)
    "E",  # pycodestyle errors (flake8)
    "W",  # pycodestyle warnings (flake8)
    "I",  # isort (import sorting)
    "UP", # pyupgrade (modern syntax)
]

# Baseline: rules from ruff's default set that the codebase does not satisfy
# yet. Remove entries as the findings get fixed.
extend-ignore = [
    "B026",    # star-arg-unpacking-after-keyword-arg
    "BLE001",  # blind-except
    "C408",    # unnecessary-collection-call
    "C414",    # unnecessary-double-cast-or-process
    "C419",    # unnecessary-comprehension-in-call
    "DTZ002",  # call-datetime-today
    "PLW1510", # subprocess-run-without-check
    "RUF012",  # mutable-class-default
    "RUF013",  # implicit-optional
    "RUF015",  # unnecessary-iterable-allocation-for-first-element
    "S102",    # exec-builtin
    "SIM101",  # duplicate-isinstance-call
    "SIM102",  # collapsible-if
    "SIM103",  # needless-bool
    "SIM114",  # if-with-same-arms
    "SIM118",  # in-dict-keys
    "SIM201",  # negate-equal-op
    "SIM210",  # if-expr-with-true-false
    "SIM211",  # if-expr-with-false-true
    "TRY004",  # type-check-without-type-error
    "TRY201",  # verbose-raise
]

# Package layout under src/
[tool.hatch.build.targets.wheel]
packages = ["src/alfred3"]

[tool.hatch.version]
path = "src/alfred3/_version.py"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[project.scripts]
alfred3 = "alfred3.cli:cli"
